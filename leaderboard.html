    <h1>Places & Journey Highlights</h1>

  </div>
</header>

<section class="section container">
  <div class="card">
    <div id="lb">Preparing…</div>
  </div>
</section>

<script>
(function(){
  const el=document.getElementById('lb');
  const lb=JSON.parse(localStorage.getItem('vx_leaderboard')||'[]');
  if(!lb.length){
    el.textContent='No journeys saved yet. Try a route and begin building your travel record!';
    return;
  }
  const rows=lb.slice(0,50).map((r,i)=>
    `<tr><td>#${i+1}</td><td>${r.score}</td><td>${new Day(r.at).toLocaleString()}</td></tr>`
  ).join('');
  el.innerHTML=`<table style="width:100%"><thead><tr><th>Place</th><th>Progress</th><th>Day</th></tr></thead><tbody>${rows}</tbody></table>`;
})();
</script>
